<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>User Login | Pratik Enterprises</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="auth-page">
      <form id="userLoginForm" class="auth-card">
        <a class="brand" href="index.html"><span class="brand-mark">P</span><span>Pratik Enterprises</span></a>
        <div>
          <p class="eyebrow">Customer Area</p>
          <h1>User Login</h1>
          <p class="muted">Enter your name to view products and use the information chatbot.</p>
        </div>
        <label>
          Name
          <input name="name" type="text" autocomplete="name" required>
        </label>
        <button type="submit">Continue</button>
        <p id="userLoginMessage" class="form-message"></p>
      </form>
    </main>
    <script src="user.js"></script>
  </body>
</html>
